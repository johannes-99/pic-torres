quarkus.application.name=pic-torres

# --- Database (NFR-001 AC-6) ---------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}

# --- Authentication: OIDC web-app flow (NFR-002, ADR-0002) ----------------------
quarkus.oidc.application-type=web-app
quarkus.oidc.client-id=pic-torres-web
quarkus.oidc.roles.source=accesstoken
quarkus.oidc.authentication.cookie-same-site=lax
quarkus.oidc.logout.path=/logout
quarkus.oidc.logout.post-logout-path=/
%prod.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}
%prod.quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET}
# At least 32 characters; encrypts the session cookie that holds the tokens.
%prod.quarkus.oidc.token-state-manager.encryption-secret=${OIDC_SESSION_SECRET}
%prod.quarkus.oidc.authentication.cookie-force-secure=true

# Dev Services start Keycloak in dev and test mode with the committed dev realm (NFR-002 AC-2).
quarkus.keycloak.devservices.realm-path=keycloak/realm.json
quarkus.keycloak.devservices.realm-name=pic-torres
%dev,test.quarkus.oidc.credentials.secret=dev-only-secret-never-use-in-production

# Access rules: health is public, everything else needs a signed-in family member (NFR-002 AC-4, AC-7).
quarkus.http.auth.permission.public.paths=/q/health,/q/health/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.policy.member.roles-allowed=member
quarkus.http.auth.permission.member.paths=/*
quarkus.http.auth.permission.member.policy=member
%dev.quarkus.http.auth.permission.devtools.paths=/q/*
%dev.quarkus.http.auth.permission.devtools.policy=permit

# CSRF for state-changing requests; names match Angular's HttpClient defaults (NFR-002 AC-5).
quarkus.rest-csrf.cookie-name=XSRF-TOKEN
quarkus.rest-csrf.token-header-name=X-XSRF-TOKEN
quarkus.rest-csrf.cookie-http-only=false
quarkus.rest-csrf.require-form-url-encoded=false

# --- Frontend via Quinoa (NFR-001 AC-3..AC-5) ---------------------------------
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.ignored-path-prefixes=/api,/images,/q,/logout
quarkus.quinoa.run-tests=true
quarkus.quinoa.package-manager-command.test=run verify
quarkus.quinoa.dev-server.port=4200
# @QuarkusTest covers the API only; the UI is tested by Vitest and Playwright.
%test.quarkus.quinoa=false

# --- Image storage (NFR-003) ------------------------------------------------------
pictorres.storage.root=${PICTORRES_STORAGE_ROOT:/data/pic-torres}
%dev.pictorres.storage.root=target/dev-storage
%test.pictorres.storage.root=${java.io.tmpdir}/pic-torres-test-${quarkus.uuid}
pictorres.thumbnail.long-edge=400

# --- Container image (NFR-005 AC-3) ---------------------------------------------
quarkus.container-image.group=johannes-99
quarkus.container-image.registry=ghcr.io
quarkus.jib.docker-executable-name=podman
quarkus.container-image.labels."io.containers.autoupdate"=registry

# Integration tests run the packaged jar with the test profile so Dev Services provide Postgres and Keycloak.
quarkus.test.integration-test-profile=test
