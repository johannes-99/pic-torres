# NFR-005 AC-5
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      quarkus:
        patterns: ['io.quarkus*']

  - package-ecosystem: npm
    directory: /backend/src/main/webui
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', 'angular-eslint']

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
